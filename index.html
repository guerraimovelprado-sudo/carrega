<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffcc00"><meta name="robots" content="noindex,nofollow"><title>Abrindo o catálogo…</title><meta http-equiv="refresh" content="1;url=https://anjodeluz.site/pedido/"><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#ffe97d,#ffcc00 65%);color:#181818;font-family:Arial,Helvetica,sans-serif;padding:24px}.card{width:min(100%,420px);padding:44px 28px;text-align:center;background:#181818;color:#fff;border:1px solid #343126;border-radius:26px;box-shadow:0 22px 55px #77550029}.icon{width:58px;height:58px;margin:0 auto 25px;border:4px solid #ffffff18;border-top-color:#ffcc00;border-right-color:#ffcc00;border-radius:50%;animation:spin .8s linear infinite}h1{font-size:27px;letter-spacing:-.8px;margin:0 0 12px}p{font-size:14px;line-height:1.6;color:#c7c4b8;margin:0}.line{height:4px;background:#ffffff12;border-radius:10px;overflow:hidden;margin:27px auto 0;width:150px}.line span{display:block;width:50%;height:100%;background:#ffcc00;animation:loading 1s ease-in-out infinite alternate}.fallback{margin-top:25px;font-size:11px;color:#aaa79d}.fallback a{color:#ffda40;text-underline-offset:3px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes loading{to{transform:translateX(100%)}}@media(prefers-reduced-motion:reduce){.icon,.line span{animation:none}.icon{border-color:#ffcc00}}</style></head><body><main class="card"><div class="icon" aria-hidden="true"></div><h1>Abrindo as ofertas…</h1><p>Você está sendo direcionado<br>para o catálogo de pedidos.</p><div class="line" aria-hidden="true"><span></span></div><p class="fallback">Se não abrir, <a href="https://anjodeluz.site/pedido/">acesse o catálogo</a>.</p></main><script src="redirect.js"></script></body></html>
